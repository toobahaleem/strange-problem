<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Scroll</title>

<style>
    body {
        background: #e9e9e9;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        padding-top: 40px;
        transition: background 0.3s;
    }

    body.dark {
        background: #111;
        color: #eee;
    }

    .toggle-dark {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #000;
        color: #fff;
        padding: 10px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
    }

    .toggle-dark:hover {
        opacity: 0.8;
    }

    .phone {
        width: 360px;
        height: 700px;
        background: white;
        border-radius: 40px;
        box-shadow: 0 0 20px rgba(0,0,0,0.25);
        overflow: hidden;
        border: 8px solid #000;
        position: relative;
        transition: background 0.3s;
    }

    body.dark .phone {
        background: #222;
        border-color: #444;
    }

    .feed {
        height: 100%;
        overflow-y: scroll;
        padding: 10px;
    }

    .post {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        margin-bottom: 20px;
        padding: 10px;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeIn 0.8s forwards;
    }

    body.dark .post {
        background: #333;
        border-color: #555;
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .username {
        font-weight: bold;
        margin-bottom: 8px;
    }

    .image {
        width: 100%;
        height: 180px;
        background: linear-gradient(135deg, #ccc, #eee);
        border-radius: 10px;
        margin-bottom: 10px;
    }

    body.dark .image {
        background: linear-gradient(135deg, #555, #777);
    }

    .caption {
        font-size: 14px;
        margin-bottom: 10px;
    }

    .actions {
        display: flex;
        gap: 15px;
        font-size: 18px;
        cursor: pointer;
    }

    .buy-now {
        background: #ff3b3b;
        color: white;
        padding: 10px 20px;
        border-radius: 12px;
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
        cursor: pointer;
        animation: shake 1.2s infinite;
    }

    @keyframes shake {
        0% { transform: translateX(0); }
        20% { transform: translateX(-3px); }
        40% { transform: translateX(3px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
        100% { transform: translateX(0); }
    }

    .final-screen {
        padding: 20px;
        text-align: center;
        font-size: 18px;
        display: none;
    }
</style>
</head>

<body>

<div class="toggle-dark">Dark Mode</div>

<div class="phone">
    <div class="feed" id="feed">

        <!-- POSTS GENERATED BELOW -->
        <!-- Each post includes: username, image, caption, like button -->

    </div>

    <div class="final-screen" id="finalScreen">
        📦 Your parcel has arrived.  
        <br><br>
        Social media won this round.
    </div>
</div>

<audio id="likeSound">
    <source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg" type="audio/ogg">
</audio>

<script>
    const posts = [
        ["@trendingnow", "I have a tendency of falling victim to the social media propaganda of the latest 'hot' and 'trending' products."],
        ["@aestheticlife", "I stare and stare, the blue light of my phone boring into my eyes."],
        ["@fantasyme", "Contemplating all the ways this product would help me, I play out different scenes starring me and the hot new bombshell."],
        ["@existentialthoughts", "At this point, I have convinced myself that my life is useless."],
        ["@unboxtherapy", "I binge watch satisfying YouTube videos of people unboxing, the 'oohs' and 'aahs' practically making me jump the gun."],
        ["@responsibleadult", "People like to call me responsible because I choose to sleep on it."],
        ["@financialtrauma", "There is a difference between being responsible and avoiding financial ruin."],
        ["@impulsebuyer", "As if there was a ticking time bomb, I press the BUY NOW button."],
        ["@regretcentral", "Was it necessary? Do I really need this?"],
        ["@maslow", "Maslow didn't have the latest social media hyped product on his hierarchy."],
        ["@innerdebate", "I continue to play a game of tennis in my head."],
        ["@deliveryday", "After five days, I hear a knock on the door."],
        ["@postmanjoy", "Man, with the amount of enthusiasm radiating off this guy, it makes me feel like I won the lottery."],
        ["@realitycheck", "The size of the box is making me anxious."],
        ["@socialmediawins", "Social media won this round."]
    ];

    const feed = document.getElementById("feed");
    const likeSound = document.getElementById("likeSound");

    posts.forEach((p, i) => {
        const post = document.createElement("div");
        post.className = "post";
        post.style.animationDelay = (i * 0.2) + "s";

        post.innerHTML = `
            <div class="username">${p[0]}</div>
            <div class="image"></div>
            <div class="caption">${p[1]}</div>
            <div class="actions">
                <span class="like">❤️</span>
                <span>💬</span>
                <span>🔗</span>
            </div>
            ${i === 7 ? '<div class="buy-now">BUY NOW</div>' : ""}
        `;

        feed.appendChild(post);
    });

    document.querySelectorAll(".like").forEach(btn => {
        btn.addEventListener("click", () => {
            btn.style.transform = "scale(1.3)";
            likeSound.play();
            setTimeout(() => btn.style.transform = "scale(1)", 150);
        });
    });

    document.querySelector(".toggle-dark").addEventListener("click", () => {
        document.body.classList.toggle("dark");
    });

    // Final screen reveal
    setTimeout(() => {
        document.getElementById("finalScreen").style.display = "block";
    }, 15000);
</script>

</body>
</html>
